<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทดสอบโฮสติ้งสำเร็จ!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            max-width: 450px;
        }
        h1 { font-size: 32px; margin-bottom: 16px; }
        p { font-size: 18px; margin-bottom: 12px; opacity: 0.95; }
        .check { font-size: 50px; margin-bottom: 20px; }
        .info { margin-top: 30px; font-size: 14px; opacity: 0.8; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="box">
        <div class="check">✅</div>
        <h1>สำเร็จแล้วครับ!</h1>
        <p>คุณอัปโหลดและโฮสติ้งเว็บไซต์ได้ถูกต้อง</p>
        <p>ลิงก์นี้ใช้งานได้จริงทุกที่ครับ</p>
    </div>
    <div class="info">
        ทดสอบเมื่อวันที่: <span id="today"></span>
    </div>

    <script>
        // แสดงวันที่ปัจจุบัน
        const d = new Date();
        document.getElementById('today').textContent = 
            d.getDate() + '/' + (d.getMonth()+1) + '/' + d.getFullYear();
    </script>
</body>
</html>
